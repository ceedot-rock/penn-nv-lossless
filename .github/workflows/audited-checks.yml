name: Audited checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tsv-integrity:
    name: Results TSVs are internally consistent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate TSV headers, rows, and checksums
        run: |
          python3 - <<'PY'
          import csv, math, sys

          METHODS = {"gzip-9", "xz-6", "zstd-3", "zstd-19",
                     "pcc", "pccx", "tnssrc",
                     "coaster-smallest", "coaster-fastpass"}
          bad = []

          def fail(msg):
              bad.append(msg)

          for path in ("results/results.tsv", "results/results-arsenal.tsv"):
              rows = list(csv.DictReader(open(path), delimiter="\t"))
              hdr = list(rows[0].keys())
              if hdr != ["tag", "method", "orig", "comp", "ratio",
                         "enc_s", "dec_s", "sha", "note"]:
                  fail(f"{path}: unexpected header {hdr}")
              for i, r in enumerate(rows, start=2):
                  if r["method"] not in METHODS:
                      fail(f"{path}:{i}: unknown method {r['method']!r}")
                  orig, comp = r["orig"], r["comp"]
                  if not orig.isdigit() or int(orig) <= 0:
                      fail(f"{path}:{i}: bad orig {orig!r}")
                  # pccx refuses incompressible inputs by design -> empty comp
                  if comp == "" and r["method"] == "pccx":
                      continue
                  if not comp.isdigit():
                      fail(f"{path}:{i}: bad comp {comp!r}")
                      continue
                  o, c = int(orig), int(comp)
                  want = c / o
                  got = float(r["ratio"])
                  if not math.isclose(want, got, rel_tol=1e-5):
                      fail(f"{path}:{i}: ratio {got} != comp/orig {want:.6f}")
                  if r["sha"] != "OK":
                      fail(f"{path}:{i}: sha is {r['sha']!r}, expected 'OK' "
                           "(every encode must decode and SHA-256-verify)")
                  for k in ("enc_s", "dec_s"):
                      try:
                          float(r[k])
                      except ValueError:
                          fail(f"{path}:{i}: bad {k} {r[k]!r}")
              print(f"{path}: {len(rows)} rows checked")

          # every corpus file must have the full 5+4 method set
          a = list(csv.DictReader(open("results/results.tsv"), delimiter="\t"))
          b = list(csv.DictReader(open("results/results-arsenal.tsv"), delimiter="\t"))
          tags_a = sorted({r["tag"] for r in a})
          tags_b = sorted({r["tag"] for r in b})
          if tags_a != tags_b:
              fail("results.tsv and results-arsenal.tsv cover different file sets")
          exp5 = {"gzip-9", "xz-6", "zstd-3", "zstd-19", "pcc"}
          for t in tags_a:
              got = {r["method"] for r in a if r["tag"] == t}
              if got != exp5:
                  fail(f"{t}: methods {sorted(got)} != expected 5-method set")
          exp4 = {"pccx", "tnssrc", "coaster-smallest", "coaster-fastpass"}
          for t in tags_b:
              got = {r["method"] for r in b if r["tag"] == t}
              if got != exp4:
                  fail(f"{t}: methods {sorted(got)} != expected 4-method set")
          print(f"corpus coverage: {len(tags_a)} files, 5+4 method sets complete")

          if bad:
              print("\n".join("FAIL " + m for m in bad))
              sys.exit(1)
          print("TSV integrity: PASS")
          PY

  readme-totals:
    name: README totals match the evidence files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recompute per-method totals and cross-check README
        run: |
          python3 - <<'PY'
          import csv, sys

          rows = (list(csv.DictReader(open("results/results.tsv"), delimiter="\t"))
                  + list(csv.DictReader(open("results/results-arsenal.tsv"), delimiter="\t")))
          totals = {}
          for r in rows:
              if r["comp"]:
                  totals.setdefault(r["method"], 0)
                  totals[r["method"]] += int(r["comp"])
          best = list(csv.DictReader(open("results/perfile_best.tsv"), delimiter="\t"))
          totals["perfile-best"] = sum(int(r["best_lab_bytes"]) for r in best)
          totals["saved-vs-xz6"] = sum(int(r["saved_vs_xz6"]) for r in best)

          readme = open("README.md").read()
          missing = [m for m, v in totals.items()
                     if f"{v:,}" not in readme]
          for m, v in sorted(totals.items()):
              print(f"{m:16s} {v:>12,}")
          if missing:
              print("FAIL: totals not present in README.md: "
                    + ", ".join(missing))
              sys.exit(1)
          print("README totals match evidence: PASS")
          PY

  drivers:
    name: Drivers parse cleanly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n on shell drivers
        run: |
          bash -n drivers/run_all.sh
          bash -n drivers/bench_one_q.sh
          echo "shell drivers parse: PASS"
      - name: py_compile on python driver
        run: |
          python3 -m py_compile drivers/arsenal_driver.py
          echo "python driver compiles: PASS"
